<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CPA - THE ABYSS</title>
    <link rel="stylesheet" href="../../quiz-app/src/styles/cpa_horror_style.css">
</head>
<body>
    <a id="stage-back" class="stage-back-link" href="../../quiz-app/index.html">← メインへ戻る</a>
    <div id="game-stage">
        <ul class="reward-sidebar" id="reward-list"></ul>
        <div class="lifeline-area">
            <button id="fifty" class="lifeline" type="button">50:50</button>
            <button id="tel"   class="lifeline" type="button">&#9742;</button>
            <button id="aud"   class="lifeline" type="button">&#128101;</button>
        </div>
        <div id="level-indicator" style="color:var(--ruby-bright); font-size:0.7rem; letter-spacing:3px;">CPA VERIFICATION</div>
        <div id="question-box"></div>
        <div class="choices-grid" id="choices-container"></div>
    </div>

    <div id="result-modal" class="overlay">
        <h1 id="res-title"></h1>
        <p  id="res-msg" style="color:white; margin:15px 0;"></p>
        <button id="retry-btn" class="retry-btn" type="button">再試行</button>
    </div>

    <script type="module" src="../../quiz-app/src/entry/cpa.js"></script>
    <footer class="quiz-footer">&copy; 2026 THE GRAND MILLIONAIRE. All Rights Reserved.</footer>
